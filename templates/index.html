<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Monitor</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; }
        .chart-container { width: 80%; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Dashboard de Tráfego</h1>
    <div class="chart-container">
        <canvas id="mainChart"></canvas>
    </div>
    <div class="chart-container">
        <canvas id="drillDownChart"></canvas>
    </div>

    <script>
        const mainChartCtx = document.getElementById('mainChart').getContext('2d');
        const drillDownChartCtx = document.getElementById('drillDownChart').getContext('2d');
        let mainChart, drillDownChart;
        let selectedClient = null;

        function initCharts() {
            mainChart = new Chart(mainChartCtx, {
                type: 'bar',
                data: { labels: [], datasets: [] },
                options: {
                    scales: { y: { beginAtZero: true, stacked: true }, x: { stacked: true } },
                    onClick: (event, elements) => {
                        if (elements.length > 0) {
                            const clientIndex = elements[0].index;
                            const clientIp = mainChart.data.labels[clientIndex];
                            selectedClient = clientIp;
                            fetchData(); 
                        }
                    }
                }
            });

            drillDownChart = new Chart(drillDownChartCtx, {
                type: 'bar',
                data: { labels: [], datasets: [] },
                options: { scales: { y: { beginAtZero: true } } }
            });
        }

        async function fetchData() {
            const response = await fetch('/metrics');
            const data = await response.json();
            updateMainChart(data.clients);
            if (selectedClient) {
                updateDrillDownChart(data.clients[selectedClient]);
            }
        }

        function updateMainChart(clients) {
            const clientIps = Object.keys(clients);
            mainChart.data.labels = clientIps;
            mainChart.data.datasets = [
                {
                    label: 'Tráfego de Entrada (bytes)',
                    data: clientIps.map(ip => clients[ip].in),
                    backgroundColor: 'rgba(54, 162, 235, 0.6)'
                },
                {
                    label: 'Tráfego de Saída (bytes)',
                    data: clientIps.map(ip => clients[ip].out),
                    backgroundColor: 'rgba(255, 99, 132, 0.6)'
                }
            ];
            mainChart.update();
        }

        function updateDrillDownChart(clientData) {
            if (!clientData) {
                drillDownChart.data.labels = [];
                drillDownChart.data.datasets = [];
                drillDownChart.update();
                return;
            }
            const protocols = Object.keys(clientData.protocols);
            drillDownChart.data.labels = protocols;
            drillDownChart.data.datasets = [
                {
                    label: `Entrada por Protocolo para ${selectedClient} (bytes)`,
                    data: protocols.map(p => clientData.protocols[p].in),
                    backgroundColor: 'rgba(75, 192, 192, 0.6)'
                },
                {
                    label: `Saída por Protocolo para ${selectedClient} (bytes)`,
                    data: protocols.map(p => clientData.protocols[p].out),
                    backgroundColor: 'rgba(255, 206, 86, 0.6)'
                }
            ];
            drillDownChart.update();
        }

        window.onload = () => {
            initCharts();
            fetchData();
            setInterval(fetchData, 5000);
        };
    </script>
</body>
</html>
